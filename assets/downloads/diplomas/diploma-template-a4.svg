<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Vote4Dance diploma template, A4 portrait (Clean print)</title>
<defs><pattern id="hatch" width="2.5" height="2.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.5" stroke="#2f9fe0" stroke-width="0.5"/></pattern></defs>
<g id="artwork" inkscape:groupmode="layer" inkscape:label="Your design"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/></g>
<g id="guides" inkscape:groupmode="layer" inkscape:label="Vote4Dance guides - delete before printing" font-family="Helvetica, Arial, sans-serif" fill="#2f9fe0">
<rect x="0.2" y="0.2" width="209.6" height="296.6" fill="none" stroke="#2f9fe0" stroke-width="0.3"/>
<line x1="105" y1="30" x2="105" y2="250" stroke="#2f9fe0" stroke-width="0.25" stroke-dasharray="2 2"/>
<text x="106.5" y="128" font-size="2.6">centre line: every text line is centred on the page</text>
<rect x="0" y="0" width="35" height="20" fill="url(#hatch)" stroke="#2f9fe0" stroke-width="0.5"/>
<rect x="5.5" y="7" width="23" height="4.4" fill="#ffffff" stroke="#2f9fe0" stroke-width="0.3"/>
<text x="17" y="10.3" font-size="2.8" font-weight="bold" text-anchor="middle">Vote4Dance</text>
<text x="1.5" y="24" font-size="3" font-weight="bold">KEEP FREE: Vote4Dance mark</text>
<text x="1.5" y="27.4" font-size="2.5">Printed on every diploma, cannot be moved.</text>
<text x="1.5" y="30.6" font-size="2.5">Mark: 6-28 mm from the left, 8-10.5 mm from the top.</text>
<text x="1.5" y="33.8" font-size="2.5">Keep this 35 x 20 mm corner plain and light.</text>
<rect x="38" y="7" width="134" height="12.5" fill="#2f9fe0" fill-opacity="0.08" stroke="#2f9fe0" stroke-width="0.35"/>
<text x="105" y="23.2" font-size="3" font-weight="bold" text-anchor="middle">Competition name</text>
<text x="105" y="26.599999999999998" font-size="2.5" text-anchor="middle">(when "Show name of competition" is on; width follows the name)</text>
<rect x="180" y="6.5" width="26" height="5.5" fill="#2f9fe0" fill-opacity="0.08" stroke="#2f9fe0" stroke-width="0.35"/>
<text x="193" y="15.6" font-size="3" font-weight="bold" text-anchor="middle">Date</text>
<rect x="20" y="138.5" width="170" height="10" fill="#2f9fe0" fill-opacity="0.08" stroke="#2f9fe0" stroke-width="0.35"/>
<text x="21.5" y="144.6" font-size="3" font-weight="bold" text-anchor="start">Start number - name(s)</text>
<rect x="20" y="151.5" width="170" height="11" fill="#2f9fe0" fill-opacity="0.08" stroke="#2f9fe0" stroke-width="0.35"/>
<text x="21.5" y="158.1" font-size="3" font-weight="bold" text-anchor="start">Club, country</text>
<rect x="20" y="163.5" width="170" height="12.5" fill="#2f9fe0" fill-opacity="0.08" stroke="#2f9fe0" stroke-width="0.35"/>
<text x="21.5" y="170.8" font-size="3" font-weight="bold" text-anchor="start">Placement - class</text>
<text x="21.5" y="135.5" font-size="2.5">Width follows the text; long names can reach almost to the page edges.</text>
<rect x="20" y="176.5" width="170" height="11" fill="#2f9fe0" fill-opacity="0.08" stroke="#2f9fe0" stroke-width="0.35" stroke-dasharray="1.5 1"/>
<text x="21.5" y="183.1" font-size="3" font-weight="bold" text-anchor="start">Extra line</text>
<text x="21.5" y="191" font-size="2.5">When a show name is printed, it takes the line under the club and the placement line moves down here.</text>
<text x="105" y="262" font-size="3.1" text-anchor="middle" font-weight="bold">Vote4Dance diploma template - A4 portrait, one diploma per page</text>
<text x="105" y="266.6" font-size="2.6" text-anchor="middle">Positions measured from a Clean print, A4, scale 100 %, with "Show name of competition" and</text>
<text x="105" y="270.20000000000005" font-size="2.6" text-anchor="middle">"Show start numbers" on. Design your artwork on the "Your design" layer and delete this blue</text>
<text x="105" y="273.80000000000007" font-size="2.6" text-anchor="middle">guide layer before sending the file to print. Print one test diploma on plain paper and hold it</text>
<text x="105" y="277.4000000000001" font-size="2.6" text-anchor="middle">against your paper to check before printing the whole stack.</text>
<text x="105" y="281.0000000000001" font-size="2.6" text-anchor="middle">Guide: docs.vote4dance.com/manager-guide/diploma-customization/</text>
</g></svg>
