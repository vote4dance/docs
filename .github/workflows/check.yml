name: Check docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - name: Help map
        run: ruby scripts/check-help.rb
      - name: Links, titles and navigation
        run: ruby scripts/check-links.rb
